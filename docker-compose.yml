version: "3.9"

services:

  # ---------- API web (FastAPI) ----------
  web:
    build: .
    container_name: multitask_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - backend

  # ---------- Worker Celery (exécute les tâches en tâche de fond) ----------
  worker:
    build: .
    container_name: multitask_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - backend

  # ---------- Planificateur (tâches périodiques type cron) ----------
  scheduler:
    build: .
    container_name: multitask_scheduler
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - backend

  # ---------- Interface de suivi des tâches (optionnel mais pratique) ----------
  flower:
    build: .
    container_name: multitask_flower
    command: celery -A app.celery_app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - backend

  # ---------- Broker / backend de résultats ----------
  redis:
    image: redis:7-alpine
    container_name: multitask_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend

volumes:
  redis_data:

networks:
  backend:
    driver: bridge
